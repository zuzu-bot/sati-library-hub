<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SATI Library</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 1rem;
        }

        .bg-effects {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .blur-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
        }

        .circle-1 {
            top: 33%;
            left: 25%;
            width: 20rem;
            height: 20rem;
            background-color: rgba(240, 180, 41, 0.05);
        }

        .circle-2 {
            bottom: 33%;
            right: 33%;
            width: 16rem;
            height: 16rem;
            background-color: rgba(38, 177, 240, 0.05);
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 28rem;
            position: relative;
            z-index: 10;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--muted-foreground);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--foreground);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted-foreground);
        }

        .form-input {
            width: 100%;
            border-radius: 0.5rem;
            background-color: var(--input);
            border: 1px solid transparent;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: var(--foreground);
            transition: all 0.2s;
        }

        .form-input::placeholder {
            color: var(--muted-foreground);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(240, 180, 41, 0.25);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted-foreground);
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .password-toggle:hover {
            color: var(--foreground);
        }

        .toggle-auth-btn {
            background: none;
            border: none;
            color: var(--muted-foreground);
            font-size: 0.875rem;
            cursor: pointer;
            transition: color 0.2s;
            margin-top: 1.5rem;
        }

        .toggle-auth-btn:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="bg-effects">
            <div class="blur-circle circle-1"></div>
            <div class="blur-circle circle-2"></div>
        </div>

        <div class="login-card-wrapper">
            <a href="index.html" class="back-link">
                <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to Home
            </a>

            <div class="glass-strong rounded-2xl p-8 glow-gold">
                <div class="text-center mb-8">
                    <div class="h-14 w-14 rounded-xl bg-primary flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="library" class="h-7 w-7 text-primary-foreground"></i>
                    </div>
                    <h1 id="auth-title" class="font-bold text-foreground" style="font-size: 1.5rem;">Welcome Back</h1>
                    <p id="auth-desc" class="text-sm text-muted-foreground mt-1">Sign in to your SATI Library account</p>
                </div>

                <form id="login-form" class="login-form">
                    <div id="name-group" class="form-group" style="display: none;">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" placeholder="Your full name" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" required placeholder="student@sati.ac.in" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" required placeholder="••••••••" class="form-input" style="padding-right: 2.5rem;">
                            <button type="button" id="password-toggle" class="password-toggle">
                                <i data-lucide="eye" class="h-4 w-4"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-royal btn-lg" style="width: 100%;">Sign In</button>
                </form>

                <div class="text-center">
                    <button id="toggle-auth" class="toggle-auth-btn">Don't have an account? Sign up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let isSignUp = false;
        const authTitle = document.getElementById('auth-title');
        const authDesc = document.getElementById('auth-desc');
        const nameGroup = document.getElementById('name-group');
        const submitBtn = document.getElementById('submit-btn');
        const toggleAuthBtn = document.getElementById('toggle-auth');
        const loginForm = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('password-toggle');

        toggleAuthBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? 'Create Account' : 'Welcome Back';
            authDesc.textContent = isSignUp ? 'Join the SATI Library' : 'Sign in to your SATI Library account';
            nameGroup.style.display = isSignUp ? 'flex' : 'none';
            submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
            toggleAuthBtn.textContent = isSignUp ? 'Already have an account? Sign in' : "Don't have an account? Sign up";

            const nameInput = document.getElementById('name');
            if (isSignUp) {
                nameInput.setAttribute('required', '');
            } else {
                nameInput.removeAttribute('required');
            }
        });

        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordToggle.innerHTML = isPassword ? '<i data-lucide="eye-off" class="h-4 w-4"></i>' : '<i data-lucide="eye" class="h-4 w-4"></i>';
            lucide.createIcons();
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';

            setTimeout(() => {
                localStorage.setItem('sati_logged_in', 'true');
                localStorage.setItem('sati_user', JSON.stringify({
                    name: isSignUp ? name : (email.split('@')[0]),
                    email: email
                }));
                window.location.href = 'dashboard.html';
            }, 600);
        });
    </script>
</body>
</html>
