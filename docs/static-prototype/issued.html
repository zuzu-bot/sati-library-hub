<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issued Books | SATI Library</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .issued-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .issued-item {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.25rem;
        }

        @media (min-width: 640px) {
            .issued-item {
                flex-direction: row;
                align-items: center;
            }
        }

        .issued-item.overdue {
            border-color: rgba(225, 29, 72, 0.3);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 500;
        }

        .status-overdue {
            color: var(--destructive);
        }
    </style>
</head>
<body>
    <div id="main-wrapper" class="flex-1 lg:ml-64">
        <main class="p-4 sm:p-6" style="max-width: 60rem; margin: 0 auto;">
            <div class="mb-6">
                <h1 class="font-bold text-foreground" style="font-size: 1.5rem; margin: 0;">Issued Books</h1>
                <p class="text-sm text-muted-foreground mt-1">Track your borrowed books and due dates</p>
            </div>

            <div class="issued-list" id="issued-list">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        const issuedBooks = [
            { id: 1, title: "Data Structures & Algorithms", author: "Cormen et al.", issuedDate: "Feb 15, 2026", dueDate: "Mar 5, 2026", status: "overdue" },
            { id: 2, title: "Engineering Physics Vol. 2", author: "H.K. Malik", issuedDate: "Feb 20, 2026", dueDate: "Mar 8, 2026", status: "active" },
            { id: 3, title: "Digital Electronics", author: "Morris Mano", issuedDate: "Feb 25, 2026", dueDate: "Mar 15, 2026", status: "active" },
        ];

        const container = document.getElementById('issued-list');
        container.innerHTML = issuedBooks.map(book => `
            <div class="glass rounded-xl issued-item ${book.status === 'overdue' ? 'overdue' : ''}">
                <div class="h-10 w-10 rounded-lg bg-primary/10 flex items-center justify-center shrink-0">
                    <i data-lucide="book-marked" class="h-5 w-5 text-primary"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-medium text-foreground text-sm" style="margin: 0;">${book.title}</p>
                    <p class="text-xs text-muted-foreground" style="margin: 0;">${book.author}</p>
                </div>
                <div class="flex items-center gap-4 text-xs">
                    <div class="flex items-center gap-1 text-muted-foreground">
                        <i data-lucide="calendar" class="h-3.5 w-3.5"></i>
                        <span>Due: ${book.dueDate}</span>
                    </div>
                    ${book.status === 'overdue' ? `
                        <span class="status-badge status-overdue">
                            <i data-lucide="alert-circle" class="h-3.5 w-3.5"></i> Overdue
                        </span>
                    ` : ''}
                </div>
                <button class="btn btn-glass btn-sm">Return</button>
            </div>
        `).join('');
        lucide.createIcons();
    </script>
</body>
</html>
